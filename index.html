<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Bonmoli</title>
  <!-- ЛОГОТИП В ВКЛАДКЕ -->
  <link rel="icon" href="https://i.postimg.cc/SRcqGfnf/Nota.png" type="image/png">
  <meta name="description" content="Создай альбом: треки + обложка = ZIP или MP3. Всё в браузере.">
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.0/Sortable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
  <style>
    :root {
      --primary: #6C5CE7;
      --primary-dark: #5A4FCF;
      --bg: #f8f9fa;
      --text: #2d3436;
      --radius: 16px;
    }
    * { box-sizing: border-box;; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    .container {
      max-width: 800px;
      margin: 2rem auto;
      background: white;
      padding: 2rem;
      border-radius: var(--radius);
      box-shadow: 0 10px 30px rgba(0,0,0,0.05);
    }

    /* ШАПКА: ЛОГО + ТЕКСТ */
    .header {
      display: flex;
      align-items: center;
      gap: 1rem;
      margin-bottom: 2rem;
      justify-content: center;
      flex-wrap: wrap;
    }
    .header img {
      width: 70px;
      height: 70px;
      border-radius: 16px;
      image-rendering: pixelated;
      box-shadow: 0 0 15px rgba(255,0,0,0.3);
    }
    .header h1 {
      font-size: 2.2rem;
      color: var(--primary);
      font-weight: 800;
      margin: 0;
    }

    label {
      display: block;
      margin: 1.2rem 0 0.4rem;
      font-weight: 600;
      font-size: 1.1rem;
    }
    input, textarea {
      width: 100%;
      padding: 0.75rem;
      border: 2px solid #dfe6e9;
      border-radius: 10px;
      font-size: 1rem;
      transition: border 0.2s;
    }
    input:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
    }

    .dropzone {
      border: 2px dashed var(--primary);
      padding: 2rem;
      text-align: center;
      border-radius: 12px;
      margin: 0.8rem 0;
      cursor: pointer;
      background: #f5f3ff;
      color: var(--primary-dark);
      font-weight: 500;
      transition: all 0.2s;
      user-select: none;
    }
    .dropzone:hover, .dropzone.dragover {
      background: #e8e4ff;
      border-color: var(--primary-dark);
    }

    .track-list {
      margin: 1.2rem 0;
      border: 1px dashed #b2bec3;
      min-height: 80px;
      padding: 0.75rem;
      border-radius: 12px;
      background: #f8f9fa;
    }
    .track-item {
      background: white;
      margin: 0.5rem 0;
      padding: 0.9rem;
      border-radius: 10px;
      cursor: move;
      display: flex;
      justify-content: space-between;
      align-items: center;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      font-weight: 500;
    }
    .track-item:hover { box-shadow: 0 4px 10px rgba(0,0,0,0.1); }

    button.remove {
      background: #ff7675;
      color: white;
      border: none;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    button.remove:hover { background: #e17055; }

    .options {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      margin: 1.2rem 0;
      font-size: 1rem;
    }
    .options label {
      margin: 0;
      cursor: pointer;
      font-weight: 500;
    }

    #createBtn {
      width: 100%;
      padding: 1rem;
      font-size: 1.3rem;
      font-weight: 600;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      margin-top: 1.5rem;
      transition: 0.2s;
    }
    #createBtn:hover:not(:disabled) {
      background: var(--primary-dark);
      transform: translateY(-1px);
    }
    #createBtn:disabled {
      background: #b2bec3;
      cursor: not-allowed;
    }

    .footer {text-align: center;
      margin-top: 3rem;
      color: #636e72;
      font-size: 0.9rem;
    }

    @media (max-width: 600px) {
      .container { padding: 1.5rem; margin: 1rem; }
      .header { flex-direction: column; text-align: center; gap: 0.8rem; }
      .header img { width: 60px; height: 60px; }
      .header h1 { font-size: 1.9rem; }
    }
  </style>
  <link href="https://rsms.inter/css/inter.css" rel="stylesheet">
</head>
<body>

<div class="container">
  <!-- ШАПКА: ЛОГО + BONMOLI -->
  <div class="header">
    <img src="https://i.postimg.cc/SRcqGfnf/Nota.png" alt="Bonmoli">
    <h1>Bonmoli</h1>
  </div>

  <label>НазваниеClique альбома</label>
  <input type="text" id="albumTitle" placeholder="Мой альбом 2025" value="Bonmoli Mix" />

  <label>Обложка (JPG, PNG, GIF)</label>
  <div class="dropzone" id="coverDrop">Нажми или перетащи обложку сюда</div>
  <input type="file" id="coverInput" accept="image/*" style="display:none" />

  <label>Треки (MP3, WAV, OGG, M4A)</label>
  <div class="dropzone" id="tracksDrop">Нажми или перетащи треки сюда</div>
  <input type="file" id="tracksInput" accept="audio/*" multiple style="display:none" />

  <label>Описание (по желанию)</label>
  <textarea id="albumDesc" rows="3" placeholder="О чём этот альбом..."></textarea>

  <h3>Порядок треков:</h3>
  <div id="trackList" class="track-list"></div>

  <div class="options">
    <input type="checkbox" id="singleFile" />
    <label for="singleFile">Сохранить в <strong>один MP3</strong> (с переходами)</label>
  </div>

  <button id="createBtn" disabled>Создать альбом</button>
</div>

<div class="footer">
  <strong>Bonmoli</strong> — альбомы без серверов, без рекламы, без регистрации.
</div>

<script>
  const tracks = [];
  const trackList = document.getElementById('trackList');
  const createBtn = document.getElementById('createBtn');
  const singleFile = document.getElementById('singleFile');

  // === Drag & Drop ===
  new Sortable(trackList, { animation: 150, onEnd: updateCreateButton });

  // === Обложка ===
  const coverDrop = document.getElementById('coverDrop');
  const coverInput = document.getElementById('coverInput');
  let coverFile = null;

  coverDrop.onclick = () => coverInput.click();
  coverInput.onchange = e => handleFiles(e.target.files, 'cover');
  coverDrop.ondragover = coverDrop.ondragenter = e => { e.preventDefault(); coverDrop.classList.add('dragover'); };
  coverDrop.ondragleave = coverDrop.ondrop = e => { e.preventDefault(); coverDrop.classList.remove('dragover'); };
  coverDrop.ondrop = e => handleFiles(e.dataTransfer.files, 'cover');

  // === Треки ===
  const tracksDrop = document.getElementById('tracksDrop');
  const tracksInput = document.getElementById('tracksInput');

  tracksDrop.onclick = () => tracksInput.click();
  tracksInput.onchange = e => handleFiles(e.target.files, 'tracks');
  tracksDrop.ondragover = tracksDrop.ondragenter = e => { e.preventDefault(); tracksDrop.classList.add('dragover'); };
  tracksDrop.ondragleave = tracksDrop.ondrop = e => { e.preventDefault(); tracksDrop.classList.remove('dragover'); };
  tracksDrop.ondrop = e => handleFiles(e.dataTransfer.files, 'tracks');

  function handleFiles(files, type) {
    Array.from(files).forEach(file => {
      if (type === 'cover' && file.type.startsWith('image/')) {
        coverFile = file;
        coverDrop.innerHTML = Обложка: <strong>${file.name}</strong>;
      }
      if (type === 'tracks' && file.type.startsWith('audio/')) {
        const id = Date.now() + Math.random();
        tracks.push({ id, file, name: file.name });
        addTrackToList(id, file.name);
      }
    });
    updateCreateButton();
  }

  function addTrackToList(id, name) {
    const div = document.createElement('div');
    div.className = 'track-item';
    div.dataset.id = id;
    div.innerHTML = <span>${name}</span><button class="remove" onclick="removeTrack('${id}')">×</button>;
    trackList.appendChild(div);
  }

  window.removeTrack = (id) => {
    const idx = tracks.findIndex(t => t.id == id);
    if (idx > -1) tracks.splice(idx, 1);
    document.querySelector(`[data-id="${id}"]`).remove();
    updateCreateButton();
  };

  function updateCreateButton() {
    createBtn.disabled = tracks.length === 0;
  }

  // === ZIP ===
  async function createZip() {
    const zip = new JSZip();
    const title = document.getElementById('albumTitle').value.trim() || 'Bonmoli Album';
    const desc = document.getElementById('albumDesc').value;

    tracks.forEach((t, i) => {
      const num = String(i + 1).padStart(2, '0');
      zip.file(`${num} - ${t.file.name}`, t.file);
    });

    if (coverFile) zip.file('cover.jpg', coverFile);

    const tracklist = tracks.map((t, i) => `${i+1}. ${t.file.name}`).join('\n');
    const info = ${title}\n${'='.repeat(title.length)}\n\nТреклист:\n${tracklist}\n\n${desc};
    zip.file('info.txt', info);

    const blob = await zip.generateAsync({ type: 'blob' });
    return { blob, filename: ${title}.zip };
  }

  // === Один MP3 ===
  async function createSingleMP3() {
    const title = document.getElementById('albumTitle').value.trim() || 'Bonmoli Album';
    const audioContext = new (window.AudioContext || window.webkitAudioContext)();
    const buffers = await Promise.all(tracks.map(t => t.file.arrayBuffer().then(ab => audioContext.decodeAudioData(ab))));

    const crossfade = 3;
    let totalDuration = buffers.reduce((s, b) => s + b.duration, 0) - crossfade * (buffers.length - 1);
    if (totalDuration < 0) totalDuration = 0;

    const sampleRate = audioContext.sampleRate;
    const output = audioContext.createBuffer(2, totalDuration * sampleRate, sampleRate);
    let offset = 0;

    buffers.forEach((buffer, i) => {
      const start = offset;
      const end = start + buffer.duration - (i < buffers.length - 1 ? crossfade : 0);

      for (let ch = 0; ch < 2; ch++) {
        const outData = output.getChannelData(ch);
        const inData = buffer.getChannelData(ch);
        for (let j = 0; j < inData.length; j++) {
          const pos = Math.floor((start + j / sampleRate) * sampleRate);
          if (pos >= output.length) break;
          let gain = 1;
          if (i > 0 && j < crossfade * sampleRate) gain = j / (crossfade * sampleRate);
          if (i < buffers.length - 1 && j > (buffer.duration - crossfade) * sampleRate) {
            gain = 1 - (j - (buffer.duration - crossfade) * sampleRate) / (crossfade * sampleRate);
          }
          outData[pos] += inData[j] * gain;
        }
      }
      offset = end;
    });

    const mp3Blob = await encodeMP3(output);
    return { blob: mp3Blob, filename: ${title}.mp3 };
  }

  function encodeMP3(buffer) {
    return new Promise(resolve => {
      const worker = new Worker(URL.createObjectURL(new Blob([`
        importScripts('https://cdn.jsdelivr.net/npm/lamejs@1.2.1/lame.min.js');
        self.onmessage = e => {
          const samples = new Int16Array(e.data.length);
          for (let i = 0; i < e.data.length; i++) samples[i] = Math.max(-32768, Math.min(32767, e.data[i] * 32767));
          const mp3encoder = new lamejs.Mp3Encoder(2, 44100, 128);
          const mp3Data = [];
          const block = 1152;
          for (let i = 0; i < samples.length; i += block) {
            const left = samples.subarray(i, i + block);
            const right = samples.subarray(i, i + block);
            const buf = mp3encoder.encodeBuffer(left, right);
            if (buf.length) mp3Data.push(buf);
          }
          const buf = mp3encoder.flush();
          if (buf.length) mp3Data.push(buf);
          self.postMessage(new Blob(mp3Data, { type: 'audio/mp3' }));
        };
      `], { type: 'application/javascript' })));

      const left = buffer.getChannelData(0);
      const right = buffer.getChannelData(1);
      const interleaved = new Float32Array(left.length);
      for (let i = 0; i < left.length; i++) interleaved[i] = (left[i] + (right[i] || 0)) / 2;

      worker.postMessage(interleaved);
      worker.onmessage = e => { resolve(e.data); worker.terminate(); };
    });
  }

  // === Создать ===
  createBtn.onclick = async () => {
    createBtn.textContent = 'Готовим...';
    createBtn.disabled = true;

    try {
      const result = singleFile.checked ? await createSingleMP3() : await createZip();
      const a = document.createElement('a');
      a.href = URL.createObjectURL(result.blob);
      a.download = result.filename;
      a.click();
      URL.revokeObjectURL(a.href);
    } catch (err) {
      alert('Ошибка: ' + err.message);
    }

    createBtn.textContent = 'Создать альбом';
    createBtn.disabled = tracks.length === 0;
  };
</script>

</body>
</html>
